# ─────────────────────────────────────────────────────────────────
# PORT HTTP standard
# ─────────────────────────────────────────────────────────────────
http_port 3128

# ─────────────────────────────────────────────────────────────────
# SSL-BUMP
# ─────────────────────────────────────────────────────────────────
http_port 3129 ssl-bump cert=/etc/squid/ssl/myCA.pem key=/etc/squid/ssl/myCA.key generate-host-certificates=on dynamic_cert_mem_cache_size=16MB

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db/certs -M 16MB
sslcrtd_children 8 startup=1 idle=1

# ─────────────────────────────────────────────────────────────────
# ACL de base
# ─────────────────────────────────────────────────────────────────
acl localnet src all
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# ACL étapes SSL-Bump
acl step1 at_step SslBump1
acl step2 at_step SslBump2
acl step3 at_step SslBump3

# ─────────────────────────────────────────────────────────────────
# Whitelist — un domaine par ligne
# ─────────────────────────────────────────────────────────────────
acl whitelist_domains dstdomain .credit-agricole.fr
acl whitelist_domains dstdomain .bnpparibas.com
acl whitelist_domains dstdomain .societegenerale.fr
acl whitelist_domains dstdomain .lcl.fr
acl whitelist_domains dstdomain .labanquepostale.fr
acl whitelist_domains dstdomain .caisseepargne.fr
acl whitelist_domains dstdomain .banquepopulaire.fr
acl whitelist_domains dstdomain .hsbc.fr
acl whitelist_domains dstdomain .boursorama.com
acl whitelist_domains dstdomain .paypal.com
acl whitelist_domains dstdomain .paypal.fr
acl whitelist_domains dstdomain .ameli.fr
acl whitelist_domains dstdomain .cpam.fr
acl whitelist_domains dstdomain .doctolib.fr
acl whitelist_domains dstdomain .service-public.fr
acl whitelist_domains dstdomain .gouv.fr
acl whitelist_domains dstdomain .caf.fr
acl whitelist_domains dstdomain .francetravail.fr
acl whitelist_domains dstdomain .khanacademy.org
acl whitelist_domains dstdomain .wikipedia.org
acl whitelist_domains dstdomain .microsoft.com
acl whitelist_domains dstdomain .windows.com
acl whitelist_domains dstdomain .microsoftonline.com
acl whitelist_domains dstdomain .apple.com
acl whitelist_domains dstdomain .icloud.com
acl whitelist_domains dstdomain .google.com
acl whitelist_domains dstdomain .googleapis.com
acl whitelist_domains dstdomain .gstatic.com
acl whitelist_domains dstdomain .cloudflare.com
acl whitelist_domains dstdomain .mozilla.org

# ─────────────────────────────────────────────────────────────────
# Politique SSL-Bump
# ─────────────────────────────────────────────────────────────────
ssl_bump peek step1
ssl_bump splice whitelist_domains
ssl_bump bump all

# ─────────────────────────────────────────────────────────────────
# Filtrage HTTPS par URL complète + IA (analyse de la page spécifique)
# %URI → URL complète après SSL-Bump ex: https://site.com/page/specific
# ─────────────────────────────────────────────────────────────────
external_acl_type https_blocker children-max=10 children-startup=5 children-idle=2 ttl=300 negative_ttl=10 %URI %SRC /usr/bin/python3 /usr/local/bin/squid_https_blocker.py

acl https_blocked external https_blocker

http_access allow whitelist_domains
http_access deny https_blocked

# ─────────────────────────────────────────────────────────────────
# Redirecteur HTTP
# ─────────────────────────────────────────────────────────────────
url_rewrite_program /usr/bin/python3 /usr/local/bin/squid_redirector.py
url_rewrite_children 5 startup=5 idle=1

# ─────────────────────────────────────────────────────────────────
# Accès général
# ─────────────────────────────────────────────────────────────────
http_access allow localnet
http_access deny all

# ─────────────────────────────────────────────────────────────────
# Logs
# ─────────────────────────────────────────────────────────────────
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache_store_log none

# ─────────────────────────────────────────────────────────────────
# Performance
# ─────────────────────────────────────────────────────────────────
cache_mem 256 MB
maximum_object_size_in_memory 1 MB
coredump_dir /var/spool/squid
