http_port 3128

# Filtrage HTTPS par domaine + enregistrement historique
external_acl_type https_blocker children=5 ttl=60 negative_ttl=60 %DST %SRC /usr/bin/python3 /usr/local/bin/squid_https_blocker.py
acl https_blocked external https_blocker

http_access deny https_blocked

# Redirecteur pour HTTP (filtrage IA + historique)
url_rewrite_program /usr/bin/python3 /usr/local/bin/squid_redirector.py
url_rewrite_children 5 startup=5 idle=1

http_access allow all

access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
