services:
  mongodb:
    image: mongo:6.0
    container_name: parental_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-changeme}
      MONGO_INITDB_DATABASE: parental_db
    networks:
      - parental_net

  backend:
    build: ./backend
    container_name: parental_backend
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - mongodb
      - ia
    environment:
      MONGO_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-changeme}@mongodb:27017
      SECRET_KEY: ${JWT_SECRET:-default-secret-key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - ./backend:/app
      - ia_config:/app/ia_config
      - squid_ssl:/etc/squid/ssl
    networks:
      - parental_net

  squid:
    build: ./proxy
    container_name: parental_squid
    restart: unless-stopped
    ports:
      - "3128:3128"
      - "3129:3129"
    depends_on:
      - ia
      - backend
    volumes:
      - squid_logs:/var/log/squid
      - squid_cache:/var/spool/squid
      - squid_ssl_db:/var/spool/squid/ssl_db
      - squid_ssl:/etc/squid/ssl
      - ia_config:/app/ia_config
    networks:
      - parental_net

  ia:
    build: ./ia
    container_name: parental_ia
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ia_config:/app/ia_config
    networks:
      - parental_net

  nginx:
    build: ./nginx
    container_name: parental_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - ia
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - parental_net

networks:
  parental_net:
    driver: bridge

volumes:
  mongo_data:
  squid_logs:
  squid_cache:
  squid_ssl_db:
  squid_ssl:
  ia_config:
